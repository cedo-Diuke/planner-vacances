<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>🌍 Planner Vacances</title>
<link href="https://googleapis.com" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#0f1117;--card:#1a1d2e;--card2:#222640;--gold:#f0a500;--teal:#00c9a7;--purple:#a78bfa;--rose:#fb7185;--sky:#38bdf8;--green:#4ade80;--text:#f0f0f0;--muted:#7a7f9a;--border:#2a2d45;--danger:#ff6b6b}
body{background:var(--bg);color:var(--text);font-family:'DM Sans',sans-serif;min-height:100vh;padding:20px 14px 40px}
#app{max-width:660px;margin:0 auto}
h1{font-family:'Playfair Display',serif;font-size:24px;font-weight:900}
h2{font-family:'Playfair Display',serif;font-size:16px;color:var(--gold)}
input,select,textarea{background:var(--card2);border:1px solid var(--border);color:var(--text);border-radius:8px;padding:9px 12px;font-family:'DM Sans',sans-serif;font-size:14px;outline:none;transition:border-color .2s;width:100%}
input:focus,select:focus,textarea:focus{border-color:var(--gold)}
input[type=date]::-webkit-calendar-picker-indicator,input[type=time]::-webkit-calendar-picker-indicator{filter:invert(.6)}
.btn{padding:10px 20px;border:none;border-radius:8px;cursor:pointer;font-family:'DM Sans',sans-serif;font-weight:600;font-size:14px;transition:all .2s;display:inline-flex;align-items:center;gap:6px}
.btn-gold{background:var(--gold);color:#1a1100}.btn-gold:hover{background:#ffc333;transform:translateY(-1px)}
.btn-teal{background:var(--teal);color:#001a16}.btn-teal:hover{background:#00e8c0;transform:translateY(-1px)}
.btn-ghost{background:transparent;color:var(--muted);border:1px solid var(--border)}.btn-ghost:hover{border-color:var(--gold);color:var(--gold)}
.btn-full{width:100%;justify-content:center;padding:13px}
.card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:18px;margin-bottom:12px}
.tag-teal{background:#00c9a715;color:var(--teal);border:1px solid #00c9a733;border-radius:20px;padding:3px 9px;font-size:11px;display:inline-flex;align-items:center}
.tag-purple{background:#7c3aed22;color:var(--purple);border:1px solid #7c3aed44;border-radius:20px;padding:2px 9px;font-size:11px;display:inline-flex;align-items:center}
.tag-rest{background:#fb718522;color:var(--rose);border:1px solid #fb718533;border-radius:20px;padding:3px 9px;font-size:11px;display:inline-flex;align-items:center}
.step-dot{width:27px;height:27px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;flex-shrink:0;cursor:pointer;background:var(--card2);color:var(--muted);transition:all .3s}
.step-dot.active{background:var(--gold);color:#1a1100}
.step-dot.completed{background:var(--teal);color:#001a16}
.spinner{width:16px;height:16px;border:2px solid transparent;border-top-color:currentColor;border-radius:50%;animation:spin .7s linear infinite;display:inline-block;vertical-align:middle}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes fadeUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
.fade-up{animation:fadeUp .35s ease forwards}
.act-card{background:var(--card2);border:1px solid var(--border);border-radius:10px;padding:13px 15px;display:flex;align-items:flex-start;gap:11px;transition:border-color .2s;margin-bottom:7px}
.checkbox{width:19px;height:19px;border-radius:5px;border:2px solid var(--border);display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:all .2s}
.checkbox.checked{background:var(--teal);border-color:var(--teal)}
.r2{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.lbl{font-size:11px;color:var(--muted);display:block;margin-bottom:4px;text-transform:uppercase;letter-spacing:.4px}
.divider{display:flex;align-items:center;gap:8px;margin:14px 0 10px}
.div-line{flex:1;height:1px;background:var(--border)}
.time-selector{margin-top:8px;display:flex;align-items:center;gap:8px;background:var(--card);padding:6px 10px;border-radius:6px;border:1px solid var(--border);width:100%}
.time-selector input[type="time"]{width:90px;padding:4px 6px;font-size:13px}
.trajet-row{background:var(--card2);border:1px solid #38bdf833;border-radius:10px;padding:13px;display:flex;align-items:flex-start;gap:10px;margin-bottom:7px}
.tip-row{font-size:12px;color:var(--muted);display:flex;gap:7px;margin-bottom:5px}
.hidden{display:none}.error{color:var(--danger);font-size:13px;margin-bottom:10px}
.steps{display:flex;gap:6px;align-items:center;margin:14px 0 22px}
.rest-banner{background:linear-gradient(135deg,#fb718515,#7c3aed15);border:1px solid #fb718533;border-radius:10px;padding:14px;text-align:center;margin-bottom:7px}
.hint{font-size:11px;color:var(--muted);margin-top:3px;line-height:1.5}
.flight-banner{background:linear-gradient(135deg,#38bdf810,#0f1117);border:1px solid #38bdf833;border-radius:12px;padding:14px;margin-bottom:8px}
.flight-row{display:flex;align-items:center;justify-content:space-between;gap:6px}
.f-airport{text-align:center;flex:1}
.f-airport .iata{font-family:'Playfair Display',serif;font-size:20px;font-weight:900;color:var(--sky)}
.f-airport .city{font-size:10px;color:var(--muted)}
.f-arrow{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px}
.f-line{height:1px;width:100%;background:linear-gradient(90deg,#38bdf8,#38bdf833)}
.item-card{background:var(--card2);border:1px solid var(--border);border-radius:10px;padding:13px;margin-bottom:9px;position:relative}
.item-card.hotel-c{border-color:#a78bfa33}
.item-card.trajet-c{border-color:#f0a50033}
</style>
</head>
<body>
<div id="app">

<div style="margin-bottom:3px;display:flex;align-items:center;gap:10px">
  <span style="font-size:24px">🌍</span><h1>Planner Vacances</h1>
</div>
<p style="color:var(--muted);font-size:12px">Vols · Pass · Road trips · Jours creux · Agenda iPhone</p>

<div class="steps" id="steps"></div>
<div id="error-zone" class="error hidden"></div>

<!-- ══════════════════ STEP 1 : VOLS ══════════════════ -->
<div id="step-1" class="card fade-up step-content">
  <h2 style="margin-bottom:14px">🛫 Destination & Transport</h2>
  <div class="r2" style="margin-bottom:12px">
    <div>
      <label class="lbl">Départ</label>
      <input type="text" id="flight-from" maxlength="3" style="text-transform:uppercase">
    </div>
    <div>
      <label class="lbl">Arrivée</label>
      <input type="text" id="flight-to" maxlength="3" style="text-transform:uppercase">
    </div>
  </div>
  <div class="r2" style="margin-bottom:14px">
    <div>
      <label class="lbl">Date Aller</label>
      <input type="date" id="date-start">
    </div>
    <div>
      <label class="lbl">Date Retour</label>
      <input type="date" id="date-end">
    </div>
  </div>
  <div class="flight-banner">
    <div class="flight-row">
      <div class="f-airport"><div class="iata" id="preview-from">---</div><div class="city">Départ</div></div>
      <div class="f-arrow"><span style="font-size:11px" id="preview-duration">✈️ Chargement...</span><div class="f-line"></div></div>
      <div class="f-airport"><div class="iata" id="preview-to">---</div><div class="city">Destination</div></div>
    </div>
  </div>
  <button class="btn btn-gold btn-full" onclick="appPlanner.nextStep()">Continuer vers les hébergements →</button>
</div>

<!-- ══════════════════ STEP 2 : LOGEMENTS & PASS ══════════════════ -->
<div id="step-2" class="card fade-up step-content hidden">
  <h2 style="margin-bottom:14px">🏨 Hébergement & Options</h2>
  <div class="item-card hotel-c">
    <label class="lbl">Hôtel Principal Base</label>
    <input type="text" id="hotel-name" style="margin-bottom:8px">
    <label class="lbl">Adresse / Localisation</label>
    <input type="text" id="hotel-zone">
  </div>
  <div class="divider"><div class="div-line"></div><span class="lbl" style="margin:0">Hôtels d'Excursion & Pass</span><div class="div-line"></div></div>
  <div id="dynamic-hotels-pass"></div>
  <div class="r2" style="margin-top:18px">
    <button class="btn btn-ghost" onclick="appPlanner.prevStep()">← Retour</button>
    <button class="btn btn-gold" onclick="appPlanner.nextStep()" style="justify-content:center">Planifier l'agenda →</button>
  </div>
</div>

<!-- ══════════════════ STEP 3 : AGENDA & EXPORT ══════════════════ -->
<div id="step-3" class="card fade-up step-content hidden">
  <h2 style="margin-bottom:14px">📅 Optimisation de l'Itinéraire</h2>
  <div id="dynamic-summary-zone"></div>
  <div class="r2" style="margin-top:18px">
    <button class="btn btn-ghost" onclick="appPlanner.prevStep()">← Étape 2</button>
    <button class="btn btn-teal" onclick="appPlanner.exportCalendar()">
      <span class="spinner hidden" id="export-spinner"></span>📥 Exporter l'agenda (.ICS)
    </button>
  </div>
</div>

</div>
